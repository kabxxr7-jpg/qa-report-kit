name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      # The runner image ships Google Chrome; the suite uses it through Playwright's "chrome" channel, so no browser is downloaded.
      - run: google-chrome --version
      - run: npm run typecheck
      - run: npm run buggy:check
      - run: npm run check:docs
      - run: npm test
      - name: Planted bugs must still be caught
        run: npm run test:buggy
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  mutation:
    # Slow (about 15 minutes), so it only runs when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run mutation:selftest
      - run: npm run mutation
